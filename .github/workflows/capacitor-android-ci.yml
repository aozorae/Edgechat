name: Capacitor Android CI
on:
  push:
    branches: [master, main]
    paths:
      - "frontend/**"
      - "capacitor/**"
      - "package.json"
      - "package-lock.json"
      - "test/**"
      - ".github/workflows/capacitor-android-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "capacitor/**"
      - "package.json"
      - "package-lock.json"
      - "test/**"
      - ".github/workflows/capacitor-android-ci.yml"
  workflow_dispatch:

concurrency:
  group: capacitor-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Google no longer serves the legacy `tools` package, and setup-android
          # still defaults to `tools platform-tools`. Pin the packages we need.
          cmdline-tools-version: "12266719"
          packages: "platform-tools"
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v4
      - name: Install dependencies
        run: npm ci
      - name: Run Node tests
        run: npm test
      - name: Test, lint and build Capacitor debug APK
        run: npm run build:capacitor
      - name: Upload Capacitor debug APK
        uses: actions/upload-artifact@v4
        with:
          name: edgechat-capacitor-debug
          path: capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
